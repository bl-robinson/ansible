---
# InfluxData rotated their signing key, so this leftover repo (telegraf is not
# installed) makes every `apt update` fail. Nothing uses it.
- name: Remove unused InfluxData apt repo
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/influxdata.list
    - /etc/apt/trusted.gpg.d/influxdata-archive_compat.gpg

- name: Add Grafana apt key
  get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add Grafana apt repo
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present

- name: Install alloy and smartmontools
  apt:
    name:
      - alloy
      - smartmontools
    state: latest
    update_cache: True
    cache_valid_time: 300
  # Alloy is not really installed during --check, so these steps cannot succeed then.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Create textfile collector directory
  file:
    path: "{{ alloy_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install ZFS/SMART metrics collector
  copy:
    src: zfs-backup-metrics
    dest: /usr/local/bin/zfs-backup-metrics
    mode: "0755"

- name: Run ZFS/SMART metrics collector every 5 minutes
  copy:
    dest: /etc/cron.d/zfs-backup-metrics
    mode: "0644"
    content: |
      # Managed by ansible (roles/alloy)
      */5 * * * * root /usr/local/bin/zfs-backup-metrics {{ alloy_textfile_dir }}/zfs_backup.prom

- name: Install alloy config
  template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    mode: "0644"
  notify: reload alloy
  # Alloy is not really installed during --check, so these steps cannot succeed then.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Start alloy
  service:
    name: alloy
    state: started
    enabled: yes
  # Alloy is not really installed during --check, so these steps cannot succeed then.
  ignore_errors: "{{ ansible_check_mode }}"
